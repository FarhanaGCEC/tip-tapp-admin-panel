name: CI/CD Pipeline - Develop

on:
  push:
    branches:
      - "develop"
  workflow_dispatch:

jobs:
  build-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Set Permissions
        run: |
          sudo chown -R $(whoami) .
          sudo chmod -R 755 .

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.0.0

      - name: Remove node_modules and package-lock.json
        run: |
          rm -rf node_modules
          rm -f package-lock.json

      - name: Install dependencies
        run: yarn install

      - name: Build the project (with 8GB memory limit)
        run: |
          export NODE_OPTIONS="--max-old-space-size=8192"
          yarn build

      - name: Copy env.staging to .env after build
        run: |
          cp .env.staging .env
          if [ -f .env ]; then
            echo ".env file has been successfully created."
            cat .env
          else
            echo "Failed to create .env file."
          fi


      - name: Print working directory
        run: pwd

      - name: Install zip and rsync
        run: sudo apt-get install -y zip rsync

      - name: Zip the dist folder and .env
        run: zip -r deployment-devadmin.zip dist .env

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan 172.188.19.124 >> ~/.ssh/known_hosts

      - name: Transfer deployment.zip to server
        run: |
          rsync -avz deployment-devadmin.zip tipapp@172.188.19.124:/home/tipapp/deployments-admin/ || { echo 'Failed to transfer file'; exit 1; }

      - name: Verify file transfer
        run: |
          ssh tipapp@172.188.19.124 << 'EOF'
            echo "Listing contents of /home/tipapp/deployments-admin/"
            ls -l /home/tipapp/deployments-admin/
          EOF

      - name: Clean server directory and extract deployment.zip
        run: |
          ssh tipapp@172.188.19.124 << 'EOF'
            echo "Checking for deployment-devadmin.zip"
            if [ -f /home/tipapp/deployments-admin/deployment-devadmin.zip ]; then
              echo "File found, extracting..."
              rm -rf /home/tipapp/deployments-admin/tipappfe-admindev/*
              unzip -o /home/tipapp/deployments-admin/deployment-devadmin.zip -d /home/tipapp/deployments-admin/tipappfe-admindev
              cp /home/tipapp/deployments-admin/tipappfe-admindev/.env /home/tipapp/deployments-admin/tipappfe-admindev/dist/
            else
              echo "Deployment zip file not found"
              exit 1
            fi
          EOF
